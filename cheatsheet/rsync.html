<h2>Rsync</h2>

<pre>
# hint: digital ocean
rsync SOURCE DESTINATION
rsync -av --delete 00_uni/ /data/disk/00_uni
-a: copy recursively, preserve time, permission
-v: verbose
--delete: files in destination folder
Don't forget '/' at the end of source folder!

-n: dry run
